name: Bootstrap standardized source

on:
  push:
    branches:
      - chore/source-and-project-structure
    paths:
      - BVH-Motion-Retargeter-standardized-source.zip

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Unpack standardized source
        run: |
          unzip -oq BVH-Motion-Retargeter-standardized-source.zip
          rm BVH-Motion-Retargeter-standardized-source.zip
          git rm -f --ignore-unmatch bvh_to_mixamo_2.3.1.zip bvh_to_mixamo_2.4.zip bvh_to_mixamo_3.1.zip
          rm .github/workflows/bootstrap-source.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: python -m pip install ruff

      - name: Fetch verified character templates
        run: python scripts/fetch_templates.py

      - name: Validate source
        run: |
          ruff check .
          python -m compileall -q bvh_to_mixamo scripts tests
          python -m unittest discover -s tests -v
          python scripts/build_release.py

      - name: Commit standardized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: standardize addon repository structure"
          git push
